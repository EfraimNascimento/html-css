<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible box</title>
</head>
<style>

    /*
    
    justify-content: define o alinhamento dos itens ao longo do main-axis (eixo principal), caso o main-axis seja alterado, o alinhamento também será alterado.

    Os valores possíveis são: 
    justify-content: flex-start; (alinha os itens no início do main-axis), 
    justify-content: flex-end; (alinha os itens no final do main-axis), 
    justify-content: center; (alinha os itens no centro do main-axis), 
    justify-content: space-between; (distribui os itens igualmente ao longo do main-axis, com o primeiro item alinhado ao início e o último item alinhado ao final), 
    justify-content: space-around; (distribui os itens igualmente ao longo do main-axis, com espaços iguais ao redor de cada item).
    justify-content: space-evenly; (distribui os itens igualmente ao longo do main-axis, com espaços iguais entre os itens e nas extremidades).

    */

    /*
    
    align-items: define o alinhamento dos itens ao longo do cross-axis (eixo transversal), caso o cross-axis seja alterado, o alinhamento também será alterado.

    Os valores possíveis são:
    align-items: flex-start; (alinha os itens no início do cross-axis), 
    align-items: flex-end; (alinha os itens no final do cross-axis),
    align-items: center; (alinha os itens no centro do cross-axis),
    align-items: stretch; (estica os itens para preencher o container ao longo do cross-axis, este é o valor padrão),
    align-items: baseline; (alinha os itens com base em suas linhas de base de texto).
    */

    div.container{
        background-color: lightsalmon;
        display: flex;

        flex-flow: row nowrap;
        justify-content: space-evenly;
        align-items: center;

        height: 300px;
    }
    div.iten{
        background-color: lightblue;
        border: 1px solid black;

        text-align: center;
    }
</style>
<body>
    <div class="container">
        <div class="iten">A</div>
        <div class="iten">B</div>
        <div class="iten">C</div>
        <div class="iten">D</div>
        <div class="iten">E</div>
        <div class="iten">F</div>
        <div class="iten">G</div>
        
    </div>
</body>
</html>
