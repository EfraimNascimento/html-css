<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible box</title>
</head>
<style>
    div.container{
        background-color: lightsalmon;

        display: flex;
    }
    div.iten{
        background-color: lightblue;
        border: 1px solid black;
        flex: auto;

        text-align: center;
    }
</style>
<body>
    <div class="container">
        <div class="iten">A</div>
        <div class="iten">B</div>
        <div class="iten">C</div>
        <div class="iten">D</div>
        <div class="iten">E</div>
        <div class="iten">F</div>
        <div class="iten">G</div>
        
    </div>
</body>
</html>
