<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible box</title>
</head>
<style>

    /*

        flex-direction: row | row-reverse | column | column-reverse;

    Utilizando flex-direction: row, temos um eixo horizontal chamado main-axis, ele começa na esquerda e vai até a direita do elemento, seu ponto inicial se chama main-start e o final se chama main-end*/

    /*Temos também o eixo transversal, chamado cross-axis, que começa no topo (cross-start) e vai até a parte inferior (cross-end) do elemento*/

    /*Estas configurações são válidas apenas em nosso idioma,considerando o sentido da leitura, além é claro do flex-direction, as posições vão variar de acordo com as configurações*/

    /*No caso da utilização do flex-direction: column, temos o main-axis vertical, que começa no topo e vai até a parte inferior do elemento, seu ponto inicial se chama (main-start) e o final se chama (main-end), o cross-axis começa na esquerda (cross-start) e vai até a parte direita (cross-end) do elemento, e estes valores se alteram de acordo com a inversão da direção da coluna*/

    /*
        flex-flow: row | row-reverse | column | column-reverse | nowrap | wrap | wrap-reverse;

        Se trata da junção de duas propriedades, a primeira é o flex-direction e a segunda é o flex-wrap.

        ex: flex-flow: row nowrap;

        Quando utilizamos o wrap no sentido de coluna ele vai criar novas colunas ao invés de linhas, já o wrap-reverse cria novas colunas na ordem inversa, isso será decidido de acordo com o espaço disponível no container flexível pai.
    */

    div.container{
        background-color: lightsalmon;
        display: flex;
        flex-flow: row wrap-reverse;

    }
    div.iten{
        background-color: lightblue;
        border: 1px solid black;
        padding: 10px;

        text-align: center;

        flex: auto;
    }
</style>
<body>
    <div class="container">
        <div class="iten">Exemplo de Bloco: A</div>
        <div class="iten">Exemplo de Bloco: B</div>
        <div class="iten">Exemplo de Bloco: C</div>
        <div class="iten">Exemplo de Bloco: D</div>
        <div class="iten">Exemplo de Bloco: E</div>
        <div class="iten">Exemplo de Bloco: F</div>
        <div class="iten">Exemplo de Bloco: G</div>
    </div>
</body>
</html>
