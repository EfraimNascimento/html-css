<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible box</title>
</head>
<style>

    /*
    
    flex-flow: row | row-reverse | column | column-reverse wrap | nowrap | wrap-reverse;
    A propriedade flex-flow é um atalho para definir as propriedades flex-direction e flex-wrap ao mesmo tempo.
    O valor padrão é row nowrap.
    
    */

    div.container{
        background-color: lightsalmon;
        display: flex;
        flex-flow: row wrap;
    }
    div.iten{
        background-color: lightblue;
        border: 1px solid black;
        
        text-align: center;
        flex-basis: 150px;

    }
</style>
<body>
    <div class="container">
        <div class="iten">A</div>
        <div class="iten">Outro conteúdo</div>
        <div class="iten">C</div>
        <div class="iten">Conteúdo um pouco maior</div>
        <div class="iten">E</div>
        <div class="iten">Conteúdo maior ainda, que vai ocupar mais espaço.</div>
        <div class="iten">G</div>
        
    </div>
</body>
</html>
