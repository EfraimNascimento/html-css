<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible box</title>
</head>
<style>

    /*
    
    flex-grow: Define a capacidade de um item flexível de crescer, ou seja, ocupar o espaço disponível no contêiner flexível.
    flex-shrink: Define a capacidade de um item flexível de encolher, ou seja, liberar espaço quando o contêiner flexível é menor que a soma dos itens flexíveis.
    flex-basis: Define o tamanho inicial de um item flexível antes de o espaço disponível ser distribuído entre os itens flexíveis.

    */

    div.container{
        background-color: lightsalmon;
        display: flex;
        flex-flow: row wrap;
    }
    div.iten{
        background-color: lightblue;
        text-align: center;
        border: 1px solid black;
        flex-basis: 200px;

    }
    div#cxA{
        flex-shrink: 0;
        flex-grow: 1;
    }
    div#cxB{
        flex-shrink: 1;
        flex-grow: 1;
    }
    div#cxC{
        flex-shrink: 3;
        flex-grow: 1;
    }
</style>
<body>
    <div class="container">
        <div class="iten" id="cxA">A</div>
        <div class="iten" id="cxB">B</div>
        <div class="iten" id="cxC">C</div>
        
    </div>
</body>
</html>
