<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio 14</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
            font-size: 1.3em;
        }

        table{
            width: 600px;
            border-collapse: collapse;
        }

        table > tbody > tr.mediaTotal{
            background-color: gray;
            color: white;
        }

        table > tbody > tr.mediaTotal > th{
            text-align: left;
        }

        td, th{
            border: 2px solid black;
            padding: 10px;
        }
        
        table > thead > tr > th{
            background-color: gray;
            color: white;
        }

        .medias{
            text-align: center;
        }

        
    </style>
</head>
<body>
    <table>
        <thead>
            <tr>
                <th rowspan="2" scope="col">Área</th>
                <th rowspan="2" scope="col">Disciplias</th>
                <th colspan="2" scope="colgroup">Notas</th>
                <th rowspan="2" scope="col">Média</th>
            </tr>
            <tr>
                <th scope="col">Nota 1</th>
                <th scope="col">Nota 2</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <th rowspan="4" scope="rowgroup">Exatas</th>
                <td>Matemática</td>
                <td class="medias">0.0</td>
                <td class="medias">0.0</td>
                <td class="medias">0.0</td>
            </tr>
            <tr>
                <td>Física</td>
                <td class="medias">0.0</td>
                <td class="medias">0.0</td>
                <td class="medias">0.0</td>
            </tr>
            <tr>
                <td>Química</td>
                <td class="medias">0.0</td>
                <td class="medias">0.0</td>
                <td class="medias">0.0</td>
            </tr>
            <tr>
                <td>Biologia</td>
                <td class="medias">0.0</td>
                <td class="medias">0.0</td>
                <td class="medias">0.0</td>
            </tr>
            <tr class="mediaTotal">
                <th colspan="4" scope="row">Média de Exatas</th>
                <td class="medias">0.0</td>
            </tr>
            <tr>
                <th rowspan="2" scope="rowgroup">Humanas</th>
                <td>História</td>
                <td class="medias">0.0</td>
                <td class="medias">0.0</td>
                <td class="medias">0.0</td>
            </tr>
            <tr>
                <td>Geografia</td>
                <td class="medias">0.0</td>
                <td class="medias">0.0</td>
                <td class="medias">0.0</td>
            </tr>
            <tr class="mediaTotal">
                <th colspan="4" scope="row">Média de Humanas</th>
                <td class="medias" >0.0</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
