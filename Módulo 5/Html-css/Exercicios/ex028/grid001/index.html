<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Layout na prática</title>
    <style>
        div.container{
            /* 
            grid-template-columns: auto auto auto;
            grid-template-rows: 100px 100px 100px; 
            
            Podemos simplificar estas duas propriedades utilizando apenas o grid-template = linha / coluna

            tambem podemos utilizar o valor: repeat(numero de vezes, tamanho), para os valores de cada linha e coluna.

            align-items: normal;Alinhamento Vertical do item
            justify-items: normal;Alinhamento Horizontal do item
            align-content: normal;Alinhamento do conteudo todo (todos os itens) Verticalmente
            justify-content: normal;/*Alinhamento do conteudo todo (todos os itens) Horizontalmente

            Essas proriedades podem ser simplificadas por:
            place-items = align-items e justify-items, respectivamente,
            place-content = align-content e justify-content respectivamente.
            */
            
            /* grid-template: repeat(3, auto) / repeat(3, auto);
            place-items: stretch center;
            place-content: start end; */
            border: 3px solid blue;
            display: grid;
            gap: 10px;
            grid-template-rows: repeat(3, 80px);
            grid-template-columns: 100px 40% repeat(2, 1fr);
            grid-auto-flow: row;
            grid-auto-columns: 120px;
            grid-auto-rows: 80px;/*Faz com que quando um elemento novo seja inserido o mesmo tenha um espaço pré-configurado dentro do grid*/
        }
        div.item{
            border: 3px solid red;
            padding: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item">A</div>
        <div class="item">B</div>
        <div class="item">C</div>
        <div class="item">D</div>
        <div class="item">E</div>
        <div class="item">F</div>
        <div class="item">G</div>
        <div class="item">H</div>
        <div class="item">I</div>
        <div class="item">J</div>
    </div>
</body>
</html>
