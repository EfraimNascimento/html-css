<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulários</title>
    <style>
        *{
            font-family: Arial, Helvetica, sans-serif;
        }
    </style>
</head>
<body>
    <h1>Meu primeiro formulário</h1>
    <form action="cadastro.php" method="post" autocomplete="off">
        <p><label for="inome">Nome: </label>
            <input type="text" name="nome" id="inome">
        </p>
        <p><label for="isobrenome">Sobrenome: </label>
            <input type="text" name="sobrenome" id="isobrenome">
        </p>
        <p>
            <input type="submit" value="Enviar">
        </p>
    </form>

    <!--get
    
        Metodo get para dados não sensiveis
        Esse metodo envida até 3 mil bytes, praticamente 3 mil letras, não é possivel utilizar enviar imagens através deste método.
        
    -->

    <!--post
    
        Metodo post, pode ser ultilizado para o envio de imagens e dados sensiveis, como endereço, cep, senha e numero de cartão de crédito por exemplo, é possivel transferir dados acima de 3 mil bytes e fazer envio de arquivos 

    -->

    <!--OBS: o ideal é aprender sobre o protocolo https para criptografia de dados sensiveis-->


</body>
</html>
